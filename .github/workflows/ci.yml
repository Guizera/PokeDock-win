name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/PokeDock.Core.Tests/PokeDock.Core.Tests.csproj --configuration Release

  windows:
    name: Windows ${{ matrix.platform }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build WinUI
        run: >-
          dotnet build src/PokeDock.Windows/PokeDock.Windows.csproj
          --configuration Release
          -p:Platform=${{ matrix.platform }}
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false

