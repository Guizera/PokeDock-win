name: Release Windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix (for example, 1.3.0)
        required: true
        type: string
      publish_release:
        description: Publish or update the public GitHub Release after signing
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: windows-2025
    environment: windows-release

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run domain tests
        run: dotnet test tests/PokeDock.Core.Tests/PokeDock.Core.Tests.csproj --configuration Release

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:MANUAL_VERSION
            $tag = "v$version"
          } else {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release versions must use X.Y.Z: $version"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "semver=$version" >> $env:GITHUB_OUTPUT
          "package_version=$version.0" >> $env:GITHUB_OUTPUT

      - name: Validate signing configuration
        shell: pwsh
        env:
          SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          if ($env:SIGNING_MODE -notin @('artifact', 'esigner', 'pfx')) {
            throw 'Set the WINDOWS_SIGNING_MODE repository variable to artifact, esigner, or pfx.'
          }

          if ($env:SIGNING_MODE -eq 'esigner') {
            if ([string]::IsNullOrWhiteSpace($env:ESIGNER_USERNAME) -or
                [string]::IsNullOrWhiteSpace($env:ESIGNER_PASSWORD) -or
                [string]::IsNullOrWhiteSpace($env:ESIGNER_TOTP_SECRET)) {
              throw 'Configure ESIGNER_USERNAME, ESIGNER_PASSWORD, and ESIGNER_TOTP_SECRET as environment secrets.'
            }
          } elseif ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            throw 'Set WINDOWS_PUBLISHER to the exact certificate subject, such as CN=Your Company, O=Your Company, C=BR.'
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            "WINDOWS_PUBLISHER=$($env:PUBLISHER)" >> $env:GITHUB_ENV
          }

      - name: Load SSL.com eSigner certificate
        if: ${{ vars.WINDOWS_SIGNING_MODE == 'esigner' }}
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          PREFERRED_THUMBPRINT: ${{ vars.ESIGNER_CERTIFICATE_THUMBPRINT }}
        run: |
          $ckaVersion = '1.1.2'
          $ckaSha256 = '071ca52986795e7a00dfbd87cc5818d03af74daac32dfe32afd4171b676c4d13'
          $ckaUrl = "https://github.com/SSLcom/eSignerCKA/releases/download/v$ckaVersion/SSL.COM-eSigner-CKA_$ckaVersion.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP 'esigner-cka.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'esigner-cka-installer'
          $installPath = Join-Path $env:RUNNER_TEMP 'eSignerCKA'
          $masterKeyPath = Join-Path $installPath 'master.key'

          Invoke-WebRequest -Uri $ckaUrl -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $ckaSha256) {
            throw "The eSigner CKA archive hash did not match the pinned release: $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $installer = Get-ChildItem $extractPath -Filter *.exe -Recurse | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'The eSigner CKA installer was not found in the downloaded archive.'
          }

          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          $installerArguments = @(
            '/CURRENTUSER'
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            "/DIR=$installPath"
          )
          $process = Start-Process $installer.FullName -ArgumentList $installerArguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "The eSigner CKA installer failed with exit code $($process.ExitCode)."
          }

          $registerKsp = Join-Path $installPath 'RegisterKSP.exe'
          $configureCsp = Join-Path $installPath 'eSignerCSP.Config.exe'
          $ckaTool = Join-Path $installPath 'eSignerCKATool.exe'
          foreach ($requiredTool in @($registerKsp, $configureCsp, $ckaTool)) {
            if (-not (Test-Path -LiteralPath $requiredTool)) {
              throw "Required eSigner CKA tool was not installed: $requiredTool"
            }
          }

          & $registerKsp | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "RegisterKSP failed with exit code $LASTEXITCODE."
          }
          & $configureCsp | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "eSignerCSP.Config failed with exit code $LASTEXITCODE."
          }
          & $ckaTool config `
            -mode product `
            -user $env:ESIGNER_USERNAME `
            -pass $env:ESIGNER_PASSWORD `
            -totp $env:ESIGNER_TOTP_SECRET `
            -key $masterKeyPath `
            -r
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA configuration failed with exit code $LASTEXITCODE."
          }

          & $ckaTool unload | Out-Null
          & $ckaTool load
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA could not load the certificate with exit code $LASTEXITCODE."
          }

          $certificates = @(
            Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
              Where-Object { $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) }
          )
          if (-not [string]::IsNullOrWhiteSpace($env:PREFERRED_THUMBPRINT)) {
            $normalizedThumbprint = $env:PREFERRED_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            $certificates = @($certificates | Where-Object Thumbprint -EQ $normalizedThumbprint)
          }
          if ($certificates.Count -ne 1) {
            throw "Expected exactly one eSigner code-signing certificate, but found $($certificates.Count). Set ESIGNER_CERTIFICATE_THUMBPRINT when the account has multiple certificates."
          }

          $certificate = $certificates[0]
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "WINDOWS_PUBLISHER=$($certificate.Subject)" >> $env:GITHUB_ENV
          "ESIGNER_CKA_DIR=$installPath" >> $env:GITHUB_ENV
          Write-Host "Loaded code-signing certificate for publisher $($certificate.Subject)."

      - name: Configure package identity
        shell: pwsh
        run: >-
          ./scripts/Set-PackageIdentity.ps1
          -Version "${{ steps.release.outputs.package_version }}"
          -Publisher $env:WINDOWS_PUBLISHER

      - name: Build x64 and ARM64 MSIX bundle
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\package\'
          msbuild src\PokeDock.Windows\PokeDock.Windows.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            '/p:AppxBundlePlatforms=x64|ARM64' `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true `
            /p:WindowsAppSDKSelfContained=true `
            "/p:AppxPackageDir=$packageDirectory"

          $bundle = Get-ChildItem $packageDirectory -Filter *.msixbundle -Recurse |
            Select-Object -First 1
          if ($null -eq $bundle) {
            throw 'MSBuild did not produce an .msixbundle.'
          }

          New-Item artifacts\release -ItemType Directory -Force | Out-Null
          Copy-Item $bundle.FullName artifacts\release\PokeDock-Windows.msixbundle

      - name: Sign in to Azure
        if: ${{ vars.WINDOWS_SIGNING_MODE == 'artifact' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        if: ${{ vars.WINDOWS_SIGNING_MODE == 'artifact' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\release\PokeDock-Windows.msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign with PFX certificate
        if: ${{ vars.WINDOWS_SIGNING_MODE == 'pfx' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 is not configured.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw 'SignTool was not found on the runner.'
          }

          & $signTool.FullName sign `
            /fd SHA256 `
            /f $certificatePath `
            /p $env:CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            artifacts\release\PokeDock-Windows.msixbundle
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed with exit code $LASTEXITCODE."
          }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Sign with SSL.com eSigner
        if: ${{ vars.WINDOWS_SIGNING_MODE == 'esigner' }}
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw 'SignTool was not found on the runner.'
          }

          & $signTool.FullName sign `
            /debug `
            /fd SHA256 `
            /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT `
            /tr http://ts.ssl.com `
            /td SHA256 `
            artifacts\release\PokeDock-Windows.msixbundle
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner SignTool operation failed with exit code $LASTEXITCODE."
          }

      - name: Verify signature and create update feed
        shell: pwsh
        run: |
          $bundle = (Resolve-Path artifacts\release\PokeDock-Windows.msixbundle).Path
          $signature = Get-AuthenticodeSignature -FilePath $bundle
          if ($signature.Status -ne 'Valid') {
            throw "The MSIX bundle signature is not valid: $($signature.StatusMessage)"
          }

          $repository = $env:GITHUB_REPOSITORY
          $tag = '${{ steps.release.outputs.tag }}'
          ./scripts/New-AppInstaller.ps1 `
            -Version '${{ steps.release.outputs.package_version }}' `
            -Publisher $env:WINDOWS_PUBLISHER `
            -AppInstallerUri "https://github.com/$repository/releases/latest/download/PokeDock.appinstaller" `
            -BundleUri "https://github.com/$repository/releases/download/$tag/PokeDock-Windows.msixbundle" `
            -OutputPath artifacts\release\PokeDock.appinstaller

      - name: Keep signed artifacts from the run
        uses: actions/upload-artifact@v4
        with:
          name: PokeDock-Windows-${{ steps.release.outputs.semver }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              artifacts\release\PokeDock-Windows.msixbundle `
              artifacts\release\PokeDock.appinstaller `
              --clobber
          } else {
            gh release create $tag `
              artifacts\release\PokeDock-Windows.msixbundle `
              artifacts\release\PokeDock.appinstaller `
              --target $env:GITHUB_SHA `
              --title "PokeDock ${{ steps.release.outputs.semver }}" `
              --generate-notes
          }

      - name: Unload SSL.com eSigner certificate
        if: ${{ always() && vars.WINDOWS_SIGNING_MODE == 'esigner' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ESIGNER_CKA_DIR)) {
            Write-Host 'eSigner CKA was not initialized; no cleanup is required.'
            exit 0
          }
          $ckaTool = Join-Path $env:ESIGNER_CKA_DIR 'eSignerCKATool.exe'
          if (Test-Path -LiteralPath $ckaTool) {
            & $ckaTool unload | Out-Null
          }
          $masterKeyPath = Join-Path $env:ESIGNER_CKA_DIR 'master.key'
          if (Test-Path -LiteralPath $masterKeyPath) {
            Remove-Item -LiteralPath $masterKeyPath -Force
          }
